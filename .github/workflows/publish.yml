name: Publish to npm

# Publishes the package when you create a GitHub Release or push a vX.Y.Z tag.
# Create a release (UI or `gh release create vX.Y.Z`) or `git push origin vX.Y.Z`
# and this builds + publishes. (npm rejects re-publishing an existing version,
# so a release created later from an already-published tag just fails the
# publish step harmlessly.)
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
