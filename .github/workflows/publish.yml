name: Publish to npm

# Publishes the package when a vX.Y.Z tag is pushed. Creating a release
# (UI or `gh release create vX.Y.Z`) creates the tag too, so it triggers this
# once; `git push origin vX.Y.Z` works as well. There is deliberately no
# `release` trigger — it would start a second, always-failing publish run.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
