<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>swarm-connect · demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        background: #0b0f12;
        min-height: 100vh;
        font-family: 'Inter', system-ui, sans-serif;
      }
      /* design tokens used by the demo chrome (the library also injects its own) */
      .swarm-connect {
        --void:#060809; --bunker:#0b0f12; --surface:#121821; --raised:#18202b; --raised-2:#1e2833;
        --line:rgba(255,255,255,0.07); --line-2:rgba(255,255,255,0.12); --line-orange:rgba(255,107,0,0.45);
        --fg:#f3f5f7; --fg-soft:#c3cad3; --fg-muted:#7d8794; --fg-faint:#565f6b;
        --accent:#ff6b00; --accent-bright:#ff8a33; --accent-deep:#d65500; --accent-ink:#1a0e02;
        --accent-glow:rgba(255,107,0,0.40); --accent-wash:rgba(255,107,0,0.10);
        --ok:#36c46a; --ok-wash:rgba(54,196,106,0.12); --ok-line:rgba(54,196,106,0.40);
        --bad:#ff5640; --bad-wash:rgba(255,86,64,0.12); --bad-line:rgba(255,86,64,0.38);
        --warn:#f0a83a; --warn-wash:rgba(240,168,58,0.12); --warn-line:rgba(240,168,58,0.40);
        --font-display:'Space Grotesk', system-ui, sans-serif;
        --font-body:'Inter', system-ui, sans-serif;
        --font-mono:'JetBrains Mono', ui-monospace, monospace;
        --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
        --hex-svg: url("data:image/svg+xml,%3Csvg width='28' height='49' viewBox='0 0 28 49' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ff6b00' stroke-opacity='0.5' stroke-width='1'%3E%3Cpath d='M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5z'/%3E%3Cpath d='M14 24.75l-13-7.5'/%3E%3C/g%3E%3C/svg%3E");
      }
      .honeycomb { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      .honeycomb::before {
        content: ""; position: absolute; inset: -10%;
        background-image: var(--hex-svg); background-size: 72px 124px; opacity: 0.85;
        -webkit-mask-image: radial-gradient(ellipse 90% 80% at 70% 0%, #000 0%, transparent 75%);
        mask-image: radial-gradient(ellipse 90% 80% at 70% 0%, #000 0%, transparent 75%);
      }
      .honeycomb::after {
        content: ""; position: absolute; inset: 0; opacity: 0.7;
        background:
          radial-gradient(ellipse 70% 55% at 88% -8%, var(--accent-glow), transparent 60%),
          radial-gradient(ellipse 60% 50% at 10% 110%, rgba(28,40,55,0.6), transparent 60%);
      }
      .scanlines {
        position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.35; mix-blend-mode: multiply;
        background-image: repeating-linear-gradient(to bottom,
          rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.13) 3px);
      }
    </style>
  </head>
  <body class="swarm-connect">
    <div class="honeycomb"></div>
    <div class="scanlines"></div>
    <div id="root"></div>
    <script type="module" src="/example/main.tsx"></script>
  </body>
</html>
